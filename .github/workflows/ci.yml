name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spv4
          POSTGRES_PASSWORD: spv4
          POSTGRES_DB: spv4_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U spv4 -d spv4_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://spv4:spv4@localhost:5433/spv4_test
      JWT_SECRET: ci-jwt-secret-0123456789
      ENCRYPTION_KEY: ci-encryption-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @spv4/shared-types
      - run: npm run typecheck -w @spv4/api
      - run: npm run db:migrate:test -w @spv4/api
      - run: npm test -w @spv4/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @spv4/shared-types
      - run: npm run lint:ts -w @spv4/web
      - run: npm test -w @spv4/web
      - run: npm run build -w @spv4/web
